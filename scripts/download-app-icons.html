<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Icon Downloader</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .card img {
      width: 128px;
      height: 128px;
      border-radius: 24px;
      margin-bottom: 12px;
    }
    .card h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #333;
    }
    .card a {
      display: inline-block;
      background: #007AFF;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      margin-top: 8px;
    }
    .card a:hover {
      background: #0056b3;
    }
    .loading {
      color: #999;
      font-style: italic;
    }
    .error {
      color: #ff3b30;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>App Store Icon Downloader</h1>
  <p>Click "Download" to save each icon (512x512 PNG)</p>
  <div class="grid" id="grid">
    <p class="loading">Loading icons...</p>
  </div>

  <script>
    const apps = [
      { name: 'iMessage', searchTerm: 'Messages Apple' },
      { name: 'Gmail', searchTerm: 'Gmail' },
      { name: 'Google Calendar', searchTerm: 'Google Calendar' },
      { name: 'Notes', searchTerm: 'Notes Apple' },
      { name: 'Safari', searchTerm: 'Safari Apple' },
      { name: 'Chrome', searchTerm: 'Google Chrome' },
      { name: 'Slack', searchTerm: 'Slack' },
      { name: 'Notion', searchTerm: 'Notion' },
      { name: 'Granola', searchTerm: 'Granola AI' },
      { name: 'Screen Time', searchTerm: 'Screen Time Parental Control' },
      { name: 'WhatsApp', searchTerm: 'WhatsApp Messenger' },
    ];

    async function fetchAppIcon(searchTerm) {
      try {
        const response = await fetch(
          `https://itunes.apple.com/search?term=${encodeURIComponent(searchTerm)}&entity=software&limit=5`
        );
        const data = await response.json();
        
        if (data.results && data.results.length > 0) {
          // Get the highest resolution icon (512x512)
          const result = data.results[0];
          let iconUrl = result.artworkUrl512 || result.artworkUrl100;
          
          // If no 512, try to get it by modifying the 100 URL
          if (!result.artworkUrl512 && result.artworkUrl100) {
            iconUrl = result.artworkUrl100.replace('100x100', '512x512');
          }
          
          return {
            iconUrl,
            appName: result.trackName,
            bundleId: result.bundleId
          };
        }
        return null;
      } catch (error) {
        console.error(`Error fetching ${searchTerm}:`, error);
        return null;
      }
    }

    async function loadAllIcons() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (const app of apps) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<p class="loading">Loading ${app.name}...</p>`;
        grid.appendChild(card);

        const result = await fetchAppIcon(app.searchTerm);
        
        if (result) {
          card.innerHTML = `
            <img src="${result.iconUrl}" alt="${app.name}" crossorigin="anonymous" />
            <h3>${app.name}</h3>
            <small style="color: #999; display: block; margin-bottom: 8px;">${result.appName}</small>
            <a href="${result.iconUrl}" download="${app.name.replace(/\s+/g, '-').toLowerCase()}-icon.png" target="_blank">Download</a>
          `;
        } else {
          card.innerHTML = `
            <h3>${app.name}</h3>
            <p class="error">Could not find icon</p>
          `;
        }
      }
    }

    loadAllIcons();
  </script>
</body>
</html>

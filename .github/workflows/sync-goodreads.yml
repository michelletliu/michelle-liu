name: Sync Goodreads to Sanity

on:
  schedule:
    # Daily at 13:00 UTC (~6am PT)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-goodreads
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync read shelf into Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GOODREADS_USER_ID: "126741914"
          GOODREADS_SHELF: read
        run: node scripts/sync-goodreads-rss.js

name: Sync Goodreads to Sanity

on:
  schedule:
    # Daily at 13:00 UTC (~6am PT)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-goodreads
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # The sync script only needs @sanity/client (fetch is built into Node).
        # Install it directly to avoid full-tree install / lockfile drift.
        run: npm install --no-save --no-audit --no-fund @sanity/client@^7

      - name: Sync read shelf into Sanity
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          GOODREADS_USER_ID: "126741914"
          GOODREADS_SHELF: read
        run: node scripts/sync-goodreads-rss.js
